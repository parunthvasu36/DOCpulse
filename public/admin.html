<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocPulse — Admin</title>
<style>
:root{
  --sky:#5b5bd6; --skydark:#3f3fb0; --skylight:#f1f0fb; --white:#ffffff;
  --text:#1e1b2e; --muted:#6b7280; --border:#e4e2f2; --bg:#f7f7fb;
}
*{box-sizing:border-box;}
.icon{width:16px;height:16px;flex-shrink:0;vertical-align:middle;}
.icon-lg{width:24px;height:24px;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;}

#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(180deg,var(--sky),var(--skylight));}
#loginScreen.hidden{display:none;}
.loginBox{background:var(--white);border-radius:16px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 15px 40px rgba(0,30,50,.25);text-align:center;}
.loginBox h1{color:var(--skydark);font-size:22px;margin:0 0 22px;font-weight:800;}
.loginBox input{width:100%;padding:13px 14px;margin-bottom:14px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--skylight);color:var(--text);}
.loginBox button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--sky);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.loginBox button:hover{background:var(--skydark);}
.loginHint{font-size:12px;color:var(--muted);margin-top:12px;}
.errMsg{color:#c0392b;font-size:13px;margin-top:10px;display:none;}

#adminScreen{display:none;}
#adminScreen.active{display:block;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:var(--white);border-bottom:1px solid var(--border);}
.topbar h1{font-size:18px;color:var(--skydark);margin:0;font-weight:800;}
.topbar button{background:var(--skylight);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;}
.main{max-width:760px;margin:0 auto;padding:30px 24px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 4px 16px rgba(0,60,90,.06);margin-bottom:20px;}
.card h2{font-size:17px;margin:0 0 16px;color:var(--skydark);}
.formRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.formRow input{flex:1;min-width:150px;padding:11px 14px;border-radius:8px;border:1px solid var(--border);font-size:14px;background:var(--skylight);color:var(--text);}
.formRow button{background:var(--sky);color:#fff;border:none;padding:11px 20px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;}
.formRow button:hover{background:var(--skydark);}
.inchargeRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--skylight);border-radius:10px;margin-bottom:10px;}
.inchargeRow .info{flex:1;min-width:180px;font-size:14px;}
.inchargeRow .info b{display:block;font-size:15px;}
.inchargeRow .info span{color:var(--muted);font-size:13px;}
.btnSmall{border:none;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;}
.btnReset{background:var(--sky);color:#fff;}
.btnReset:hover{background:var(--skydark);}
.btnDelete{background:#fee2e2;color:#b91c1c;}
.btnDelete:hover{background:#fecaca;}
.emptyMsg{color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <h1 style="display:flex;align-items:center;justify-content:center;gap:10px;"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>DocPulse</h1><div style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px;">Administrator Login</div>
    <input type="text" id="loginUsername" placeholder="Admin username" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <div class="errMsg" id="loginError"></div>
    <div class="loginHint">This page is for administrators only. In-charges should log in at the main panel instead.</div>
  </div>
</div>

<div id="adminScreen">
  <div class="topbar">
    <h1 style="display:flex;align-items:center;gap:8px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>DocPulse — Admin</h1>
    <button id="logoutBtn" style="display:flex;align-items:center;gap:6px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</button>
  </div>
  <div class="main">
    <div class="card">
      <h2>Add a New In-Charge Account</h2>
      <div class="formRow">
        <input id="newUsername" placeholder="Username">
        <input id="newPassword" type="password" placeholder="Password">
      </div>
      <div class="formRow">
        <input id="newName" placeholder="Full name">
        <input id="newDesignation" placeholder="Designation (optional)">
        <button id="addBtn">Add In-Charge</button>
      </div>
    </div>

    <div class="card">
      <h2>Existing In-Charge Accounts</h2>
      <div id="inchargeList"></div>
    </div>
  </div>
</div>

<script>
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

async function api(path, options){
  const res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, options||{}));
  if(!res.ok){
    const body = await res.json().catch(()=>({error:'Request failed'}));
    throw new Error(body.error || 'Request failed');
  }
  return res.json();
}

function showLogin(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('adminScreen').classList.remove('active');
}
function showAdmin(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminScreen').classList.add('active');
  loadIncharges();
}

document.getElementById('loginBtn').onclick = async ()=>{
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if(!username || !password) return;
  try{
    const data = await api('/api/login', {method:'POST', body: JSON.stringify({username, password})});
    if(data.role !== 'admin'){
      errEl.textContent = 'This account is not an administrator account.';
      errEl.style.display = 'block';
      await api('/api/logout', {method:'POST'});
      return;
    }
    showAdmin();
  }catch(e){
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
};

['loginUsername','loginPassword'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    var pw = document.getElementById('loginPassword');
    if(id === 'loginUsername' && !pw.value){ pw.focus(); return; }
    document.getElementById('loginBtn').click();
  });
});

document.getElementById('logoutBtn').onclick = async ()=>{
  try{ await api('/api/logout', {method:'POST'}); }catch(e){}
  showLogin();
};

async function loadIncharges(){
  try{
    const list = await api('/api/incharges');
    const el = document.getElementById('inchargeList');
    el.innerHTML = list.length ? list.map(u => `
      <div class="inchargeRow">
        <div class="info"><b>${escapeHtml(u.name)}</b><span>${escapeHtml(u.username)}${u.designation ? ' — '+escapeHtml(u.designation) : ''}</span></div>
        <button class="btnSmall btnReset" data-resetid="${u.id}" style="display:inline-flex;align-items:center;gap:5px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>Reset Password</button>
        <button class="btnSmall btnDelete" data-delid="${u.id}" style="display:inline-flex;align-items:center;gap:5px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Remove</button>
      </div>`).join('') : '<div class="emptyMsg">No in-charge accounts yet. Add one above.</div>';

    el.querySelectorAll('[data-delid]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Remove this in-charge account? This cannot be undone.')) return;
        try{ await api('/api/incharges/'+btn.getAttribute('data-delid'), {method:'DELETE'}); await loadIncharges(); }
        catch(e){ alert(e.message); }
      };
    });
    el.querySelectorAll('[data-resetid]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-resetid');
        const newPassword = prompt('Enter a new password for this in-charge (at least 4 characters):');
        if(newPassword === null) return;
        if(newPassword.length < 4){ alert('Password must be at least 4 characters.'); return; }
        try{
          await api('/api/incharges/'+id+'/password', {method:'PATCH', body: JSON.stringify({password:newPassword})});
          alert('Password updated. Tell the in-charge their new password.');
        }catch(e){ alert(e.message); }
      };
    });
  }catch(e){
    // session likely expired or not admin
    showLogin();
  }
}

document.getElementById('addBtn').onclick = async ()=>{
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const name = document.getElementById('newName').value.trim();
  const designation = document.getElementById('newDesignation').value.trim();
  if(!username || !password || !name) return alert('Username, password, and name are required.');
  try{
    await api('/api/incharges', {method:'POST', body: JSON.stringify({username, password, name, designation})});
    document.getElementById('newUsername').value='';
    document.getElementById('newPassword').value='';
    document.getElementById('newName').value='';
    document.getElementById('newDesignation').value='';
    await loadIncharges();
  }catch(e){ alert(e.message); }
};

// Check if already logged in as admin
(async function init(){
  try{
    const me = await api('/api/me');
    if(me.role === 'admin') showAdmin();
    else showLogin();
  }catch(e){
    showLogin();
  }
})();
</script>
</body>
</html>
